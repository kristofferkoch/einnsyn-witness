name: Daily witness

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Test
        run: npm test

      - name: Run witness
        run: node witness.mjs

      - name: Commit snapshot
        if: always()
        run: |
          git config user.name "einnsyn-witness"
          git config user.email "actions@github.com"
          git add snapshots/ state.json CHANGELOG.md
          # last_run.txt always changes (new timestamp) → guarantees a commit per
          # run, so a skipped cron is a MISSING commit, not silence. Guard the add
          # in case node never wrote it (e.g. setup failure).
          [ -f last_run.txt ] && git add last_run.txt
          STATUS="no-heartbeat"
          [ -f last_run.txt ] && STATUS="$(head -1 last_run.txt)"
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "witness: $(date -u +%Y-%m-%d) ${STATUS}"
            git push
          fi
